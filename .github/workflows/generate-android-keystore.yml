name: Generate Android Keystore (Tanpa PC)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Alias key (huruf kecil/angka, contoh: kedaikhanxa)"
        required: false
        default: "kedaikhanxa"
      keystore_password:
        description: "Password keystore minimal 6 karakter (kosongkan untuk generate otomatis)"
        required: false
        default: ""
      owner_name:
        description: "Nama pemilik/toko pada sertifikat"
        required: false
        default: "Kedai Khanxa"

jobs:
  generate-keystore:
    name: Buat Keystore & Ambil SHA-1 / SHA-256
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Keystore (.jks) & Ekstrak SHA-1 / SHA-256
        id: gen
        shell: bash
        run: |
          set -euo pipefail
          ALIAS="${{ github.event.inputs.key_alias }}"
          ALIAS="${ALIAS:-kedaikhanxa}"
          OWNER="${{ github.event.inputs.owner_name }}"
          OWNER="${OWNER:-Kedai Khanxa}"
          PASS="${{ github.event.inputs.keystore_password }}"
          if [ -z "$PASS" ]; then
            PASS="Khanxa$(openssl rand -hex 6)"
          fi
          if [ ${#PASS} -lt 6 ]; then
            echo "Password keystore minimal 6 karakter." >&2
            exit 1
          fi

          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/khanxa-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=$OWNER, OU=POS, O=KedaiKhanxa, L=Indonesia, ST=ID, C=ID"

          CERT_INFO=$(keytool -list -v -keystore out/khanxa-release.jks -alias "$ALIAS" -storepass "$PASS")
          SHA1=$(echo "$CERT_INFO" | awk -F'SHA1: ' '/SHA1:/{print $2}' | xargs)
          SHA256=$(echo "$CERT_INFO" | awk -F'SHA256: ' '/SHA256:/{print $2}' | xargs)

          base64 -w 0 out/khanxa-release.jks > out/keystore_base64.txt

          echo "::add-mask::$PASS"
          {
            echo "## Keystore Berhasil Dibuat"
            echo ""
            echo "> **PENTING KEAMANAN:** Gunakan repositori **Private** di GitHub. Simpan hasil secret di **Settings -> Secrets and variables -> Actions**, lalu **hapus run workflow ini** setelah selesai menyalin secret."
            echo ""
            echo "### 1. Salin SHA-1 & SHA-256 ke Firebase Console"
            echo "Buka Firebase Console -> Project \`flash-lead-kwpgt\` -> Add Android App \`com.kedaikhanxa.app\`:"
            echo "- **SHA-1:** \`$SHA1\`"
            echo "- **SHA-256:** \`$SHA256\`"
            echo ""
            echo "### 2. Simpan GitHub Repository Secrets"
            echo "Download artifact **khanxa-keystore-bundle** di halaman run ini untuk mengambil isi file \`keystore_base64.txt\`, lalu buat secrets berikut:"
            echo "- \`KEY_ALIAS\`: \`$ALIAS\`"
            echo "- \`KEYSTORE_PASSWORD\`: \`$PASS\`"
            echo "- \`KEY_PASSWORD\`: \`$PASS\`"
            echo "- \`KEYSTORE_BASE64\`: *(isi teks dari file \`keystore_base64.txt\`)*"
            echo "- \`GOOGLE_SERVICES_JSON\`: *(isi file \`google-services.json\` yang diunduh dari Firebase Console)*"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Keystore & Base64 Bundle (Berlaku 1 Hari)
        uses: actions/upload-artifact@v4
        with:
          name: khanxa-keystore-bundle
          path: out/
          retention-days: 1
